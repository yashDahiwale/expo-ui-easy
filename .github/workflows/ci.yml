name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run generate:check -w expo-ui-easy
      - run: npm run typecheck
      - run: npm test
      - run: node --test e2e/bench/lib.test.mjs
      - run: npm run build

  # The package must work on every @expo/ui patch inside its peer range: the oldest we support and the newest 58.x.
  # A failure on the newest means Expo changed something (see the contract tests' messages); on the oldest it means
  # we started using something that was added later (raise the peer minimum).
  compat:
    name: "@expo/ui ${{ matrix.expo-ui }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        expo-ui: ["58.0.28", "58"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm install --no-save --no-audit --no-fund -w expo-ui-easy @expo/ui@${{ matrix.expo-ui }}
      - run: npm run typecheck -w expo-ui-easy
      - run: npm test -w expo-ui-easy

  # What gets published must be what a consumer can use.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run verify-package -w expo-ui-easy
      - run: npm run typecheck:consumer -w expo-ui-easy-example

  # The documentation site builds, and its examples compile against the package.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck:examples -w expo-ui-easy-docs
      - run: npm run typecheck -w expo-ui-easy-docs
      - run: npm run build -w expo-ui-easy-docs
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SITE_URL: ${{ vars.DOCS_SITE_URL }}
