# Every press bumps the counter by exactly one.
appId: dev.expouieasy.example
---
- launchApp
- runFlow:
    file: _open.yaml
    env:
      SLUG: button
      TITLE: Button
- assertVisible: "presses=0"
- tapOn: "Filled (default)"
- assertVisible: "presses=1"
- tapOn: "Text"
- assertVisible: "presses=2"
