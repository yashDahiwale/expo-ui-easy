# One component per family opens without a red box, and Android back returns to the list.
appId: dev.expouieasy.example
---
- launchApp:
    clearState: true
- assertVisible: "expo-ui-easy"
- assertVisible: "Search components"
- inputText: "slider"
- assertVisible: "Slider"
- tapOn: "Slider"
- assertVisible: "<Slider />"
- pressKey: back
- assertVisible: "Search components"
- runFlow:
    file: _open.yaml
    env:
      SLUG: button
      TITLE: Button
- assertNotVisible: "Unhandled JS Exception.*"
- pressKey: back
- runFlow:
    file: _open.yaml
    env:
      SLUG: icon-button
      TITLE: IconButton
- assertNotVisible: "Unhandled JS Exception.*"
- pressKey: back
- runFlow:
    file: _open.yaml
    env:
      SLUG: floating-action-button
      TITLE: FloatingActionButton
- assertNotVisible: "Unhandled JS Exception.*"
- pressKey: back
- runFlow:
