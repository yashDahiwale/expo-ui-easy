# Every preview screen opens without a red box and the app returns to the home list.
appId: dev.expouieasy.example
---
- launchApp:
    clearState: true
- assertVisible: "Native UI playground"
- runFlow:
    file: _open.yaml
    env:
      TITLE: "NativeList"
- assertNotVisible: "Unhandled JS Exception.*"
- pressKey: back
- assertVisible: "Native UI playground"
- runFlow:
    file: _open.yaml
    env:
      TITLE: "Buttons"
- assertNotVisible: "Unhandled JS Exception.*"
- pressKey: back
- assertVisible: "Native UI playground"
- runFlow:
    file: _open.yaml
    env:
      TITLE: "Switch"
- assertNotVisible: "Unhandled JS Exception.*"
- pressKey: back
- assertVisible: "Native UI playground"
- runFlow:
    file: _open.yaml
    env:
